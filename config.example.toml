# Copy this file to config.toml and fill in your values.
# config.toml is gitignored — each machine has its own.

# Path to the yt-dlp binary
# macOS example:  "~/dev/yt-dlp/yt-dlp.sh"
ytdlp_path = "~/dev/yt-dlp/yt-dlp.sh"

# Directory where FLAC files are saved
# macOS example:  "~/Library/CloudStorage/GoogleDrive-you@gmail.com/My Drive/Music"
output_dir = "~/path/to/output"

# YouTube / YouTube Music playlist URLs — synced in order.
# The legacy single `playlist_url` key is still supported.
playlist_urls = [
    "https://music.youtube.com/playlist?list=YOURPLAYLISTID",
]

# Optional: read cookies from a browser to reach age-restricted or members-only
# tracks. Accepts a browser name or "browser:profile" (e.g. "chrome", "firefox").
# Leave commented out to disable.
# cookies_from_browser = "chrome"

# ntfy.sh topic — pick something unique and keep it private
# Subscribe at https://ntfy.sh/<your-topic> or via the ntfy app
ntfy_topic = "your-unique-topic-name"
